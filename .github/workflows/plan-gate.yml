name: Plan Gate

# GH-600 Domain 1: "Define boundaries between planning, reasoning, and action"
#
# This workflow is wired in as a REQUIRED STATUS CHECK via the repository
# ruleset (governance.tf). It fails the pull request unless the PR
# description contains a completed "## Plan" section, turning "write a plan
# first" from a convention into an enforced gate — i.e. the agent (or a human
# simulating one) cannot get to "act" without a reviewable "plan" existing.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  require-plan:
    # Defensive gating: only evaluate this in a real PR context, even though
    # workflow_dispatch is enabled above for manual testing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description contains a completed plan
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt

          if ! grep -q "## Plan" pr_body.txt; then
            echo "::error::No '## Plan' section found. Fill in the PR template before requesting review."
            exit 1
          fi

          awk '/^## Plan/{in_plan=1; next} in_plan && /^## /{exit} in_plan' pr_body.txt > plan.txt

          # Goal is inline, while success criteria are checklist items on
          # following lines in the PR template.
          if grep -qE "\*\*Goal:\*\*[[:space:]]*$" plan.txt || \
             ! awk '/\*\*Success criteria \(verifiable\):\*\*/{in_criteria=1; next} in_criteria && /^- \*\*/{exit} in_criteria && /^[[:space:]]+- \[[ xX]\] .+/{found=1} END{exit !found}' plan.txt; then
            echo "::error::Plan section looks incomplete — template placeholders were not filled in."
            exit 1
          fi

          echo "Plan section present and appears complete."
